<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hannacha Crypto | منصة إطلاق العملات</title>
    <!-- استخدام Tailwind المباشر مع مكتبات Ethers و Axios -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/5.7.2/ethers.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/axios/1.6.5/axios.min.js"></script>
    <style>
        .gold-text { color: #D4AF37; }
        .gold-bg { background-color: #D4AF37; }
        .gold-border { border-color: #D4AF37; }
        .gold-glow { box-shadow: 0 0 12px rgba(212, 175, 55, 0.2); }
    </style>
</head>
<body class="bg-black text-gray-200 font-sans min-h-screen flex flex-col justify-between">

    <!-- الهيدر متوافق مع شاشات الهاتف -->
    <header class="border-b border-gray-900 p-4 bg-zinc-950 flex justify-between items-center">
        <h1 class="text-xl font-black gold-text tracking-wide">HANNACHA CRYPTO</h1>
        <button id="connectWalletBtn" onclick="connectWallet()" class="gold-bg text-black font-bold px-4 py-1.5 rounded-full text-xs">
            ربط المحفظة 🦊
        </button>
    </header>

    <!-- واجهة النموذج -->
    <main class="flex-grow flex items-center justify-center p-3">
        <div class="bg-zinc-900 p-5 rounded-xl border gold-border gold-glow w-full max-w-sm space-y-4">
            <div class="text-center">
                <h2 class="text-lg font-bold text-white">إطلاق وتوثيق العملات تلقائياً 🟢</h2>
                <p class="text-[11px] text-gray-400">صك فوري بالشعار الموثق على BscScan</p>
            </div>

            <form id="tokenForm" class="space-y-3" onsubmit="handleFormSubmit(event)">
                <div>
                    <label class="block text-[11px] font-medium mb-1 text-gray-400">اسم العملة:</label>
                    <input type="text" id="tokenName" required placeholder="مثال: Hannacha Coin" class="w-full px-3 py-1.5 bg-black border border-gray-800 rounded-lg text-white text-xs focus:outline-none">
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-[11px] font-medium mb-1 text-gray-400">الرمز:</label>
                        <input type="text" id="tokenSymbol" required placeholder="HNC" class="w-full px-3 py-1.5 bg-black border border-gray-800 rounded-lg text-white text-xs focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-[11px] font-medium mb-1 text-gray-400">العشريات:</label>
                        <input type="number" id="tokenDecimals" value="18" required class="w-full px-3 py-1.5 bg-black border border-gray-800 rounded-lg text-white text-xs focus:outline-none">
                    </div>
                </div>
                <div>
                    <label class="block text-[11px] font-medium mb-1 text-gray-400">إجمالي المعروض:</label>
                    <input type="number" id="tokenSupply" value="1000000" required class="w-full px-3 py-1.5 bg-black border border-gray-800 rounded-lg text-white text-xs focus:outline-none">
                </div>
                <div>
                    <label class="block text-[11px] font-medium mb-1 text-gray-400">أيقونة الشعار:</label>
                    <input type="file" id="tokenLogo" accept="image/*" required class="w-full text-xs text-gray-400 file:py-1 file:px-3 file:rounded file:bg-zinc-800 file:text-white file:border-0 cursor-pointer">
                </div>

                <!-- الشروط -->
                <div class="bg-black p-2.5 rounded-lg border border-yellow-600/20 text-[10px] text-gray-400 space-y-1">
                    <p class="font-bold gold-text">⚠️ الشروط والرسوم الآلية:</p>
                    <p>• الرسوم: 2% (0.02 BNB) تذهب لدعم المنصة.</p>
                    <p>• الاستقطاع التلقائي: 0.1% للمنصة و 0.1% للأيردروب.</p>
                    <label class="flex items-center space-x-1.5 space-x-reverse mt-1.5 cursor-pointer">
                        <input type="checkbox" required class="rounded bg-black border-gray-700 checked:bg-yellow-500">
                        <span class="text-gray-300">أوافق على الشروط والنسب.</span>
                    </label>
                </div>

                <button type="submit" id="actionBtn" class="w-full gold-bg text-black font-bold py-2.5 rounded-lg text-xs tracking-wide">
                    صك العملة وتفعيل التوثيق الفوري 🚀
                </button>
            </form>
        </div>
    </main>

    <!-- الفوتر متوافق مع الجوال -->
    <footer class="border-t border-gray-900 bg-zinc-950 p-4 text-center text-[10px] text-gray-500 space-y-1">
        <p>© 2026 Hannacha Crypto. جميع الحقوق محفوظة.</p>
        <p>📧 <a href="mailto:medeacrypto@gmail.com" class="gold-text">medeacrypto@gmail.com</a> | 🐦 <a href="https://x.com" target="_blank" class="gold-text">@MedeaCrypto</a></p>
    </footer>

    <script>
        let userAddress = null; let provider = null;
        const FACTORY_CONTRACT_ADDRESS = "0xc3d6eb4349ad7b3bb533e85d8dd8baefc76fbebd"; 
        const FACTORY_ABI = ["function deployNewToken(string memory _name, string memory _symbol, uint8 _decimals, uint256 _supply, string memory _tokenURI) external payable returns (address)"];

        // الـ JWT الصحيح والكامل بدون اختصار
        const PINATA_JWT = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySW5mb3JtYXRpb24iOnsiaWQiOiIwMzFkNjI4Yy1iOGUzLTQzYmUtOWY2NC0wYzBlODI1Zjc1M2QiLCJlbWFpbCI6Im11c3RhcGhhYm91emlkaTkyMkBnbWFpbC5jb20iLCJlbWFpbF92ZXJpZmllZCI6dHJ1ZSwicGluX3BvbGljeSI6eyJyZWdpb25zIjpbeyJkZXNpcmVkUmVwbGljYXRpb25Db3VudCI6MSwiaWQiOiJGUkExIn0seyJkZXNpcmVkUmVwbGljYXRpb25Db3VudCI6MSwiaWQiOiJOWUMxIn1dLCJ2ZXJzaW9uIjoxfSwibWZhX2VuYWJsZWQiOmZhbHNlLCJzdGF0dXMiOiJBQ1RJVkUifSwiYXV0aGVudGljYXRpb25UeXBlIjoic2NvcGVkS2V5Iiwic2NvcGVkS2V5S2V5IjoiNmQzNjE5ZDlmNjA3OTExODhmNzIiLCJzY29wZWRLZXlTZWNyZXQiOiIyODBiODBlMDRiMjFkMGI0NmU1OTc1MzUwNjEzYTE5N2NhYjYyNDk0MjlkNjJmYjIzYzAxNTUzNDI5M2IwOTc0IiwiZXhwIjoxODIwMDg2MDAyfQ.A_rolyWcy0ky_cjX7e7VDTak_mmvaXokucabRTGI6h8";

        async function connectWallet() {
            if (window.ethereum) {
                provider = new ethers.providers.Web3Provider(window.ethereum);
                const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
                userAddress = accounts[0];
                document.getElementById('connectWalletBtn').innerText = userAddress.substring(0,5) + "..." + userAddress.substring(39);
            } else {
                window.location.href = "https://metamask.app.link/dapp/" + window.location.host + window.location.pathname;
            }
        }

        async function handleFormSubmit(e) {
            e.preventDefault();
            if (!userAddress) { await connectWallet(); return; }

            const btn = document.getElementById('actionBtn');
            btn.disabled = true; btn.innerText = "جاري رفع الشعار لـ IPFS... ⏳";

            const name = document.getElementById('tokenName').value;
            const symbol = document.getElementById('tokenSymbol').value;
            const decimals = parseInt(document.getElementById('tokenDecimals').value);
            const supply = document.getElementById('tokenSupply').value;
            const logoFile = document.getElementById('tokenLogo').files[0];

            try {
                let formData = new FormData();
                formData.append('file', logoFile);
                const resFile = await axios.post('https://api.pinata.cloud/pinning/pinFileToIPFS', formData, {
                    maxBodyLength: 'Infinity',
                    headers: { 'Content-Type': 'multipart/form-data', 'Authorization': `Bearer ${PINATA_JWT}` }
                });
                const imageUrl = `https://gateway.pinata.cloud/ipfs/${resFile.data.IpfsHash}`;

                const metadata = { name, symbol, decimals, image: imageUrl, description: "Verified by Hannacha Crypto.", verified: true };
                const resMeta = await axios.post('https://api.pinata.cloud/pinning/pinJSONToIPFS', metadata, {
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${PINATA_JWT}` }
                });
                const metaUrl = `https://gateway.pinata.cloud/ipfs/${resMeta.data.IpfsHash}`;

                btn.innerText = "تأكيد رسوم الـ 2% في المحفظة... 🔓";
                const signer = provider.getSigner();
                const factoryContract = new ethers.Contract(FACTORY_CONTRACT_ADDRESS, FACTORY_ABI, signer);
                
                const tx = await factoryContract.deployNewToken(
                    name, symbol, decimals, 
                    ethers.utils.parseUnits(supply, decimals), 
                    metaUrl,
                    { value: ethers.utils.parseEther("0.02") }
                );

                btn.innerText = "جاري التأكيد على الشبكة... ⛓️";
                await tx.wait();
                alert("🎉 نجاح! تم صك عملتك الموثقة بالعلامة الخضراء بنجاح!");
                btn.innerText = "تم الصك بنجاح! ✅";
            } catch (err) {
                alert("فشلت العملية: " + err.message);
                btn.disabled = false; btn.innerText = "صك العملة وتفعيل التوثيق الأخضر الفوري 🚀";
            }
        }
    </script>
</body>
</html>
