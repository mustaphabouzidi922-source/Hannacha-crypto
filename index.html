<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة إنشاء العملات الرقمية بالشعار</title>
    <!-- استدعاء مكتبة Axios لإرسال البيانات ومكتبة Tailwind لتنسيق سريع وأنيق -->
    <script src="https://jsdelivr.net"></script>
    <script src="https://tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white font-sans min-h-screen flex items-center justify-center p-4">

    <div class="bg-gray-800 p-8 rounded-2xl shadow-2xl w-full max-w-md border border-gray-700">
        <h2 class="text-2xl font-bold text-center mb-6 text-green-400">🚀 إطلاق عملة جديدة بالشعار آلياً</h2>
        
        <form id="tokenForm" class="space-y-5">
            <!-- اسم العملة -->
            <div>
                <label class="block text-sm font-medium mb-1 text-gray-300">اسم العملة (Token Name):</label>
                <input type="text" id="tokenName" required placeholder="مثال: Bitcoin" 
                       class="w-full px-4 py-2 bg-gray-750 border border-gray-600 rounded-lg focus:outline-none focus:border-green-500 text-white bg-gray-700">
            </div>

            <!-- رمز العملة -->
            <div>
                <label class="block text-sm font-medium mb-1 text-gray-300">رمز العملة (Symbol):</label>
                <input type="text" id="tokenSymbol" required placeholder="مثال: BTC" 
                       class="w-full px-4 py-2 bg-gray-750 border border-gray-600 rounded-lg focus:outline-none focus:border-green-500 text-white bg-gray-700">
            </div>

            <!-- رفع الشعار -->
            <div>
                <label class="block text-sm font-medium mb-1 text-gray-300">شعار العملة (Logo):</label>
                <input type="file" id="tokenLogo" accept="image/*" required 
                       class="w-full text-sm text-gray-400 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-green-600 file:text-white hover:file:bg-green-700 cursor-pointer">
            </div>

            <!-- زر الإرسال -->
            <button type="submit" id="submitBtn"
                    class="w-full bg-green-500 hover:bg-green-600 text-gray-900 font-bold py-3 px-4 rounded-lg transition duration-200 shadow-lg">
                رفع البيانات وتجهيز الميتا-داتا 🌟
            </button>
        </form>

        <!-- صندوق عرض النتائج للمطور أو المستخدم -->
        <div id="resultBox" class="mt-6 hidden bg-gray-900 p-4 rounded-lg border border-gray-700 text-xs overflow-x-auto space-y-3">
            <p class="text-green-400 font-bold text-sm">🎉 تم الرفع بنجاح!</p>
            <div>
                <span class="text-gray-400 block">رابط الصورة المباشر:</span>
                <a id="imageUrlLink" href="#" target="_blank" class="text-blue-400 underline break-all"></a>
            </div>
            <div>
                <span class="text-gray-400 block">رابط الميتا-داتا النهائي (Metadata URL):</span>
                <a id="metadataUrlLink" href="#" target="_blank" class="text-yellow-400 font-mono underline break-all"></a>
            </div>
            <p class="text-gray-400 italic text-[11px] mt-2">💡 ملاحظة: الرابط الأصفر الأخير هو ما ستقوم بتمريره لعقدك الذكي لتوثيق الشعار تلقائياً.</p>
        </div>
    </div>

    <!-- كود الـ JavaScript للربط مع السيرفر الخلفي -->
    <script>
        document.getElementById('tokenForm').addEventListener('submit', async (e) => {
            e.preventDefault(); // منع الصفحة من إعادة التحميل

            const submitBtn = document.getElementById('submitBtn');
            const resultBox = document.getElementById('resultBox');
            
            // تغيير حالة الزر أثناء الرفع
            submitBtn.disabled = true;
            submitBtn.innerText = "جاري الرفع إلى IPFS... ⏳";
            resultBox.classList.add('hidden');

            // تجميع البيانات في صيغة FormData لكي تدعم رفع الملفات
            const formData = new FormData();
            formData.append('tokenName', document.getElementById('tokenName').value);
            formData.append('tokenSymbol', document.getElementById('tokenSymbol').value);
            formData.append('logo', document.getElementById('tokenLogo').files[0]);

            try {
                // إرسال البيانات إلى السيرفر الخلفي (تأكد أن السيرفر يعمل على المنفذ 3000)
                const response = await axios.post('http://localhost:3000/api/create-token-metadata', formData, {
                    headers: {
                        'Content-Type': 'multipart/form-data'
                    }
                });

                if (response.data.success) {
                    // إظهار النتائج وروابط الـ IPFS المستلمة
                    document.getElementById('imageUrlLink').href = response.data.imageUrl;
                    document.getElementById('imageUrlLink').innerText = response.data.imageUrl;

                    document.getElementById('metadataUrlLink').href = response.data.metadataUrl;
                    document.getElementById('metadataUrlLink').innerText = response.data.metadataUrl;

                    resultBox.classList.remove('hidden');

                    // 🛠️ خطوتك القادمة كمطور:
                    // هنا يمكنك استدعاء مكتبة ethers.js أو web3.js لتنفيذ المعاملة على محفظة المستخدم
                    // ومثال ذلك: await contract.createToken(name, symbol, response.data.metadataUrl);
                }
            } catch (error) {
                alert('عذراً، حدث خطأ أثناء عملية الرفع الآلي: ' + (error.response?.data?.error || error.message));
            } finally {
                // إعادة الزر لحالته الطبيعية
                submitBtn.disabled = false;
                submitBtn.innerText = "رفع البيانات وتجهيز الميتا-داتا 🌟";
            }
        });
    </script>
</body>
</html>
